# docker-compose.prod.yml
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    env_file: ./backend/.env
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sfm
      MYSQL_USER: sfm
      MYSQL_PASSWORD: sfm
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data-prod:/var/lib/mysql

volumes:
  db-data-prod:
