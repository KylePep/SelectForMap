# docker/nginx/prod.conf
server {
    listen 80;
    root /var/www/frontend;
    index index.html;

    location /api {
        rewrite ^/api(/.*)$ $1 break;
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Not nested inside /api: try_files above does an internal redirect to
    # /index.php, which restarts location matching from the top level against
    # top-level locations only (a nested location here would never be
    # reached). This mirrors the working pattern in docker/nginx/dev.conf.
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
